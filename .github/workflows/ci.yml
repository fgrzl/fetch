name: CI

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *' # daily at 02:00 UTC
  push:
    branches:
      - '**'
    paths:
      - 'src/**'
      - 'tests/**'
      - 'bench/**'
      - '.github/workflows/ci.yml'
      - 'package*.json'
      - 'tsconfig.json'
      - 'vite.config.ts'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'src/**'
      - 'tests/**'
      - 'bench/**'
      - '.github/workflows/ci.yml'
      - 'package*.json'
      - 'tsconfig.json'
      - 'vite.config.ts'

permissions:
  contents: read
  packages: write
  actions: write

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '24'
          cache: true

      - name: Install Dependencies
        run: vp install

      - name: Check
        run: vp check

      - name: Test
        run: vp test

      - name: Bench
        run: vp test bench --run

      - name: Build
        run: vp pack
